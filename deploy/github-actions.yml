# Build and deploy the vocabulary site. Drop this into .github/workflows/ once the AWS account and
# its OpenID Connect trust exist.
#
# No access key is stored. The role below trusts GitHub's own token, for this repository and this
# branch only, which is why the branch must be protected: push access to it is write access to the
# bucket.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write          # required to mint the OIDC token

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  WCO_BASE: https://test-wcodm.trade-commons.org/
  S3_BUCKET: wco-test-vocabulary
  CLOUDFRONT_DISTRIBUTION_ID: REPLACE_WHEN_THE_DISTRIBUTION_EXISTS
  AWS_REGION: ap-southeast-2

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: pip install openpyxl rdflib markdown
      - run: scripts/build_all.sh

      # The host has to be baked in, so a build at the wrong one is caught here rather than after
      # it is published: the pages carry absolute IRIs and differ only in that.
      - name: Check the build is at the expected host
        run: |
          grep -q "$WCO_BASE" dist/Consignment/index.ttl \
            || { echo "ERROR: built at the wrong host; WCO_BASE did not take"; exit 1; }

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::REPLACE_ACCOUNT:role/github-deploy-wco-dm
          aws-region: ${{ env.AWS_REGION }}

      - run: pip install boto3
      - run: python3 deploy/aws/upload-s3.py dist
      - name: Invalidate the distribution
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths '/*'
